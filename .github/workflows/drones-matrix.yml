name: Drone platform builds

on:
  workflow_dispatch:
    inputs:
      include_ports:
        description: Compile unfinished ports too (expected to fail until adapters are complete)
        type: boolean
        default: false
  push:
    paths: ['fabric_mod/src/**', 'fabric_mod/platforms/**', 'fabric_mod/release/**', 'fabric_mod/tools/**', 'fabric_mod/*.gradle', 'fabric_mod/gradle.properties', 'fabric_mod/gradle/**', '.github/workflows/drones-matrix.yml']
  pull_request:
    paths: ['fabric_mod/src/**', 'fabric_mod/platforms/**', 'fabric_mod/release/**', 'fabric_mod/tools/**', 'fabric_mod/*.gradle', 'fabric_mod/gradle.properties', 'fabric_mod/gradle/**', '.github/workflows/drones-matrix.yml']

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          INCLUDE_PORTS: ${{ inputs.include_ports }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          data = json.loads(pathlib.Path('fabric_mod/release/matrix.json').read_text())
          targets = [{'loader': t['loader'], 'minecraft': t['minecraft']} for t in data['targets']
                     if t['status'] in ('ready', 'compiled') or os.getenv('INCLUDE_PORTS') == 'true']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('targets=' + json.dumps({'include': targets}) + '\n')
          PY

  build:
    needs: matrix
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Install pinned legacy Java runtimes and Gradle
        if: inputs.include_ports
        working-directory: fabric_mod
        run: python tools/bootstrap_toolchains.py
      - name: Build target
        working-directory: fabric_mod
        shell: pwsh
        run: .\tools\build_matrix.ps1 -Loader '${{ matrix.loader }}' -Minecraft '${{ matrix.minecraft }}' -SkipTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DronesJoyrideInterface-${{ matrix.minecraft }}-${{ matrix.loader }}
          path: mod/V*/*.jar
          if-no-files-found: warn
