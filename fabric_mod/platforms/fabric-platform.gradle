apply from: '../../platform-conventions.gradle'
repositories { maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "maven.modrinth:geckolib:${geckolib_id}"
    compileOnly 'io.github.llamalad7:mixinextras-fabric:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.4.1'
    include implementation('com.fazecast:jSerialComm:2.11.0')
}
loom {
    mixin { defaultRefmapName = 'dji-avata-drone-refmap.json' }
    mods { djimod { sourceSet sourceSets.main; sourceSet project(':common').sourceSets.main } }
    runs { client { client() }; server { server() } }
}
tasks.named('remapJar') { archiveVersion = '' }
