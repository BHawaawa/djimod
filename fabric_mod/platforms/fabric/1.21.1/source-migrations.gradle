ext.portSourceFilter = { String line ->
    def itemData = 'com.example.avatadrone.compat.ItemData'
    // Receivers in the shared tree are stack locals/fields or context.getStack().
    def receiver = /([\w.]+(?:\([^()]*\))?)/
    line = line.replaceAll(receiver + /\.getNbt\(\)/, { all, stack -> "${itemData}.read(${stack})" })
    line = line.replaceAll(receiver + /\.hasNbt\(\)/, { all, stack -> "${itemData}.has(${stack})" })
    line = line.replaceAll(receiver + /\.hasCustomName\(\)/, { all, stack ->
        // Only ItemStack receivers use this removed method; entities keep theirs.
        stack in ['stack', 'context.getStack()'] ? "${stack}.contains(net.minecraft.component.DataComponentTypes.CUSTOM_NAME)" : all
    })
    line = line.replaceAll(receiver + /\.getOrCreateNbt\(\)\.(put\w*)\(/, { all, stack, method -> "${itemData}.${method}(${stack}, " })
    line = line.replaceAll(receiver + /\.removeSubNbt\(/, { all, stack -> "${itemData}.remove(${stack}, " })
    line = line.replaceAll(receiver + /\.setNbt\(/, { all, stack -> "${itemData}.set(${stack}, " })
    line
}


