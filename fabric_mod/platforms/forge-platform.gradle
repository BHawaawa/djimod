apply from: '../../platform-conventions.gradle'
repositories {
    maven {
        url = 'https://bmclapi2.bangbang93.com/maven/'
        content { includeGroupByRegex 'net\\.minecraftforge.*' }
    }
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.fabricmc.net/' }
}
minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        client { workingDirectory project.file('run'); mods { djimod { source sourceSets.main } } }
        server { workingDirectory project.file('run-server'); mods { djimod { source sourceSets.main } } }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("maven.modrinth:geckolib:${geckolib_id}")
    implementation 'com.fazecast:jSerialComm:2.11.0'
    compileOnly 'net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
jar {
    manifest.attributes('MixinConfigs': 'avatadrone.mixins.json,avatadrone.client.mixins.json')
    finalizedBy 'reobfJar'
}
